name: DockShift

options:
  bundleIdPrefix: com.quentinsteinke
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.1"
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

configFiles:
  Debug: Config/Updates.xcconfig
  Release: Config/Updates.xcconfig

settings:
  base:
    # Team ID is the certificate's OU (8C5LBVCRXP), not the "(9TGC4GGJ59)" suffix in the cert name.
    DEVELOPMENT_TEAM: 8C5LBVCRXP
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

targets:
  DockShift:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DockShift/Sources
      - path: DockShift/Resources
    dependencies:
      - package: Sparkle
      - sdk: AppIntents.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Embed Rune renderer
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$SRCROOT/build/rune/libdockshift_ui.dylib" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          if [ "$CODE_SIGNING_ALLOWED" != NO ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/libdockshift_ui.dylib"
          fi
        inputFiles:
          - $(SRCROOT)/build/rune/libdockshift_ui.dylib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libdockshift_ui.dylib
    info:
      path: DockShift/Info.plist
      properties:
        CFBundleDisplayName: DockShift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright 2026 Quentin Steinke"
        SUFeedURL: $(DOCKSHIFT_UPDATE_FEED_URL)
        SUPublicEDKey: $(DOCKSHIFT_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DockShift/DockShift.entitlements
      properties:
        # Must stay unsandboxed: DockShift writes the com.apple.dock preferences and restarts the Dock.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quentinsteinke.DockShift
        PRODUCT_NAME: DockShift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/rune"
        OTHER_LDFLAGS: "$(inherited) -ldockshift_ui"

schemes:
  DockShift:
    build:
      targets:
        DockShift: all
    run:
      config: Debug
    archive:
      config: Release
